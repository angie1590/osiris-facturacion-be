name: Temporary Backend Audit Suite

on:
  push:
    branches:
      - audit/test-run-20261028-be

permissions:
  contents: read

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: osiris_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d osiris_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      SRI_MODO_EMISION: NO_ELECTRONICO
      FEEC_TIPO_EMISION: "1"
      FEEC_REGIMEN: GENERAL
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/osiris_test
      CATALOG_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/osiris_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: osiris_test
      RUN_LIVE_SMOKE: "false"
      PYTHONPATH: ./src
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Poetry
        run: pip install "poetry>=2.0,<3"

      - name: Prepare dependencies without unversioned FE-EC wheel
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("pyproject.toml")
          text = path.read_text(encoding="utf-8")
          dependency = '    "fe-ec @ lib/fe_ec-0.1.0-py3-none-any-3.whl",\n'
          if dependency not in text:
              raise SystemExit("Expected FE-EC path dependency was not found")
          path.write_text(text.replace(dependency, ""), encoding="utf-8")
          PY
          poetry lock --no-interaction --regenerate

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Ruff
        run: poetry run ruff check src tests

      - name: Mypy full source
        run: poetry run mypy src

      - name: Pytest full suite with PostgreSQL opt-in tests
        run: poetry run pytest -q -rs

  docs-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install docs dependencies
        working-directory: docs
        run: npm ci

      - name: Build docs
        working-directory: docs
        run: npm run build --silent
