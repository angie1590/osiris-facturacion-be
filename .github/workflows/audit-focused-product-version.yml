name: Temporary Focused Product Version Audit

on:
  push:
    branches:
      - audit/current-20261105-be

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
      SRI_MODO_EMISION: NO_ELECTRONICO
      FEEC_TIPO_EMISION: "1"
      FEEC_REGIMEN: GENERAL
      RUN_LIVE_SMOKE: "false"
      PYTHONPATH: ./src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "poetry>=2.1,<3"
      - name: Prepare dependencies without private FE-EC artifact
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("pyproject.toml")
          text = path.read_text(encoding="utf-8")
          dependency = '    "fe-ec @ lib/fe_ec-0.1.0-py3-none-any-3.whl",\n'
          if dependency not in text:
              raise SystemExit("Expected FE-EC path dependency was not found")
          path.write_text(text.replace(dependency, ""), encoding="utf-8")
          PY
          poetry lock --no-interaction --regenerate
          poetry install --no-interaction --no-root
      - name: Focused regression
        run: poetry run pytest -q tests/test_audit_product_child_version.py
