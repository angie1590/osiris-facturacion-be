name: Temporary Current Backend Audit

on:
  push:
    branches:
      - audit/current-20261105-be

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: osiris_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d osiris_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/osiris_test
      DB_URL_ALEMBIC: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/osiris_test
      CATALOG_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/osiris_test
      DIRECTORY_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/osiris_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: osiris_test
      SRI_MODO_EMISION: NO_ELECTRONICO
      FEEC_TIPO_EMISION: "1"
      FEEC_REGIMEN: GENERAL
      RUN_LIVE_SMOKE: "false"
      PYTHONPATH: ./src
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: python -m pip install "poetry>=2.1,<3"

      - name: Prepare dependencies without private FE-EC artifact
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("pyproject.toml")
          text = path.read_text(encoding="utf-8")
          dependency = '    "fe-ec @ lib/fe_ec-0.1.0-py3-none-any-3.whl",\n'
          if dependency not in text:
              raise SystemExit("Expected FE-EC path dependency was not found")
          path.write_text(text.replace(dependency, ""), encoding="utf-8")
          PY
          poetry lock --no-interaction --regenerate

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Ruff
        run: poetry run ruff check src tests

      - name: Mypy
        id: mypy
        continue-on-error: true
        run: poetry run mypy src

      - name: Pytest full suite with PostgreSQL opt-in tests
        id: pytest
        run: poetry run pytest -q -rs

      - name: Preserve mypy failure
        if: always() && steps.mypy.outcome == 'failure'
        run: |
          echo "Mypy failed; pytest was executed to collect both results."
          exit 1

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install docs dependencies
        working-directory: docs
        run: npm ci
      - name: Build docs
        working-directory: docs
        run: npm run build --silent
